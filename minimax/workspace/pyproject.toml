[project]
name = "taskboard"
version = "0.1.0"
description = "Task board business service used as the SDD work target"
requires-python = ">=3.11,<4"
dependencies = []

[project.scripts]
taskboard = "taskboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskboard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
