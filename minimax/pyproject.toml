[project]
name = "sdd-context"
version = "1.0.0"
description = "Specification-driven development context module (seekdb + PowerContext + MiniMax)"
requires-python = ">=3.11,<4"
dependencies = [
    "httpx>=0.28,<1",
    "powercontext[builtin,seekdb]>=1.4,<2",
]

[project.scripts]
sdd-context = "sdd_context.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdd_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
